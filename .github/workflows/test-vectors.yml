name: test-vectors

on:
  push:
    branches: [main]
    paths:
      - "docs/test-vectors/**"
      - ".github/workflows/test-vectors.yml"
  pull_request:
    paths:
      - "docs/test-vectors/**"
      - ".github/workflows/test-vectors.yml"

defaults:
  run:
    working-directory: docs/test-vectors/generator

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: docs/test-vectors/generator/go.mod
      - name: gofmt (must be clean)
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (RFC + third-party Noise vectors + regeneration guard)
        run: go test ./...
      - name: regenerate and diff (vectors must never drift from the generator)
        run: |
          go run . -dir ..
          git diff --exit-code -- ..
          test -z "$(git status --porcelain -- ..)"
