<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>nimna — icons (3.3)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0B0B0C; color:#A8A6A0; font-family:system-ui,sans-serif; padding:48px 24px; }
  h1 { font-size:15px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:#8a8884; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:12px; max-width:1100px; }
  .cell { background:#141416; border:1px solid #26262A; border-radius:14px; padding:18px 10px 12px; text-align:center; }
  .cell svg { width:24px; height:24px; stroke:#A8A6A0; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  .cell div { font-size:10.5px; margin-top:10px; color:#6d6b67; font-family:ui-monospace,monospace; }
  .cell.amber svg { stroke:#F2A65A; }
  .cell.amber div::after { content:" (state)"; color:#F2A65A; }
</style>
</head>
<body>
<h1>nimna icons — 24px grid · 1.75 stroke · currentColor</h1>
<div class="grid" id="grid"></div>
<script>
const icons = ["plus","keypad","qr","scan","copy","share","sliders","chevron-right","arrow-left","close","check","timer-fade","bell","bell-off","line-cut","hang-up","knock","pencil","info","restore","eye-off","external"];
const amberOnes = new Set(["knock","timer-fade"]);
fetch("icons.svg").then(r => r.text()).then(txt => {
  const doc = new DOMParser().parseFromString(txt, "image/svg+xml");
  const grid = document.getElementById("grid");
  icons.forEach(name => {
    const g = doc.getElementById("i-" + name);
    const cell = document.createElement("div");
    cell.className = "cell" + (amberOnes.has(name) ? " amber" : "");
    cell.innerHTML = `<svg viewBox="0 0 24 24">${g ? g.innerHTML : ""}</svg><div>i-${name}</div>`;
    grid.appendChild(cell);
  });
});
</script>
</body>
</html>
