<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nimna — before it sends</title><link rel="stylesheet" href="screens.css"></head>
<body>
<div class="screen dark">
  <div class="statusbar"><span>9:41</span><span class="batt"></span></div>
  <div class="navbar">
    <svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M10.5 6.5 5 12l5.5 5.5"/></svg>
    <div class="title2" style="flex:1">Marlowe</div>
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 14.5c4.5-5 11.5-5 16 0l-2.6 2.6c-.9-.7-2-1.2-3.4-1.5l-.4-2.4c-1-.2-2.2-.2-3.2 0l-.4 2.4c-1.4.3-2.5.8-3.4 1.5L4 14.5Z"/></svg>
  </div>
  <div style="padding:0 20px">
    <div class="line live"><i></i></div>
    <div class="micro" style="color:var(--accent);margin-top:6px">On the line</div>
  </div>
  <div class="chat">
    <div class="msg recv">Send it over when you can.</div>
  </div>
  <div style="padding:0 20px 12px;display:flex;flex-direction:column;gap:12px">
    <div class="card" style="display:flex;gap:14px;align-items:center;padding:12px">
      <span class="mediaimg window" style="width:96px;height:72px;border-radius:8px"></span>
      <div style="flex:1;min-width:0">
        <div class="body">IMG_0413 · 2.1 MB</div>
        <div class="caption t3" style="margin-top:2px">Location, device, and time stripped</div>
        <div class="caption t3">Sent smaller — original quality is a toggle away</div>
      </div>
      <svg class="ic" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </div>
    <div class="whisper">
      <div class="body">This looks like sensitive content — send anyway?</div>
      <div class="acts">
        <div class="btn ghost compact">Go back</div>
        <div class="btn secondary compact">Send anyway</div>
      </div>
    </div>
  </div>
  <div class="composer">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8"/><circle cx="15.1" cy="4.6" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="6.8" r="1" fill="currentColor" stroke="none"/><circle cx="19.6" cy="9.6" r="1" fill="currentColor" stroke="none"/><path d="M12 8v4l2.5 2.5"/></svg>
    <div class="field">Message…</div>
    <div class="sendbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
  </div>
  <div style="height:14px"></div>
  <div class="homebar"></div>
</div>
</body></html>
