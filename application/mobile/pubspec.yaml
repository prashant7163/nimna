name: nimna
description: "nimna — a private line between two people."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependency set is fixed by docs/architecture/app-architecture.md §1
# (tech-architect sign-off per dependency). Additions are a review event.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # libsodium FFI — the S2-locked AEAD (ChaCha20-Poly1305-IETF), randombytes,
  # SecureKey native-memory key storage. Sign-off: app-architecture.md §1.
  sodium: ^4.0.2
  # SHA-256 / HMAC-SHA-256 for the in-repo RFC 5869 HKDF composition.
  crypto: ^3.0.7
  # SQLite via the platform library; stores only ciphertext blobs + integers.
  sqflite: ^2.4.3
  # Exactly TWO items (Keychain / Keystore): the wrapped 32-byte master key
  # and the lock config (nimna/lock/v1, lib/src/lock/lock_config_store.dart).
  flutter_secure_storage: ^10.3.1
  # Directory resolution only.
  path_provider: ^2.1.6
  # Path joins (already transitive via sqflite; imported directly).
  path: ^1.9.1
  # OS biometric prompt only (S13 app lock). Sign-off: SESSION-13 intake §4.
  # Fence: ONE call site (lib/src/lock/biometric_gate.dart), biometricOnly —
  # the fallback is Nimna's own PIN pad, never the OS device credential.
  local_auth: ^3.0.1
  # Version dictated by the Flutter SDK pin, per Flutter guidance.
  intl: any
  # Dart-team static annotations only (@visibleForTesting on the reduced
  # Argon2id test cost, protocol layer — no Flutter import allowed there).
  # Already transitive via sodium/qr; imported directly, zero runtime code.
  meta: ^1.16.0
  # Pure-Dart QR encoder (kevmoo; zero runtime deps beyond meta). Rendering
  # is an in-repo CustomPainter over its module matrix; correctness pinned by
  # a committed expected-matrix fixture. Sign-off: S8 intake (SESSION-8.md
  # §7); hand-rolled Reed–Solomon and qr_flutter both rejected there.
  qr: ^3.0.2
  # Platform share sheet only (code text + QR PNG). Scoped sign-off: S8
  # intake (SESSION-8.md §7) — ONE call-site module
  # (lib/src/pairing/initiator/share.dart), decrypt-to-temp cleanup after
  # handoff, zero telemetry/network verified at pin time (the url_launcher_*
  # transitives serve desktop/web mailto fallbacks; mobile is a platform
  # channel).
  share_plus: ^13.2.0
  # QR scan (live camera + still-image decode) for the F3 join methods.
  # Pinned to the BUNDLED-MLKit variant (com.google.mlkit:barcode-scanning,
  # the on-device model shipped in the app) — NOT play-services-mlkit-* (which
  # downloads models and carries the play-services telemetry surface). Zero
  # network / zero analytics verified at pin time (SESSION-9 deps audit;
  # app-architecture.md §1). Fence: ONE call-site module
  # (lib/src/pairing/joiner/join_entry/qr_source.dart); camera-permission copy
  # is the F3.2 canonical string. Sign-off: SESSION-9 intake (deps).
  mobile_scanner: 7.2.0
  # OS file/photo picker for the "upload a QR image or PDF" join method
  # (spec §3.1 method iv). ONE call site (join_entry/upload_source.dart);
  # FileType.custom (image + pdf). No telemetry/network (SESSION-9 deps audit).
  file_picker: 11.0.2
  # Rasterizes page 1 of an uploaded PDF → image → analyzeImage (the QR
  # decode path). Spec §3.1 mandates PDF; the rasterizer choice is CODE.
  # ONE call site (join_entry/upload_source.dart). No telemetry/network
  # (SESSION-9 deps audit).
  pdfrx: 2.4.4
  # Pure-Dart image decode → EXIF/metadata strip → re-encode (S11 media,
  # spec §5.1). 100% on-device and network-incapable BY CONSTRUCTION: no
  # platform channel, no socket API — "zero network calls" is structural.
  # EXIF strip is likewise structural — decoding to a pixel buffer and
  # re-encoding cannot carry the EXIF APP1 segment; bakeOrientation keeps
  # the orientation-tag removal from rotating the image. Runs inside
  # Isolate.run to keep the 5 MB worst case off the UI isolate. Fence: ONE
  # call site (lib/src/media/pipeline/image_processor.dart). Sign-off:
  # SESSION-11 intake §2 (pin-time no-telemetry audit — clean). Rejected:
  # flutter_image_compress (native libjpeg surface, non-auditable EXIF).
  image: ^4.5.4
  # Platform IAP (S17 paywall). First-party Flutter-team plugins; the app's
  # ONLY billing surface. Fenced to lib/src/billing/store_entitlement_source
  # (billing_fences_test). Pinned exact after a pin-time transitive
  # no-telemetry audit (flutter pub deps + analytics/firebase/crashlytics/
  # sentry/beacon grep) — clean. Sign-off: SESSION-17 intake (dependency
  # proposal); app-architecture.md §1.
  in_app_purchase: 3.2.4
  in_app_purchase_storekit: 0.4.10+1
  in_app_purchase_android: 0.4.0+11

# Windows-only FFI (win32) has a resolution clash: file_picker 11 needs
# win32 ^5.9 (its Windows COM picker uses 5.x APIs) while share_plus ^13.2
# declares ^6.0.1. Nimna builds ONLY iOS/Android, where win32 is never
# compiled or linked; but `flutter test` compiles every plugin's desktop
# implementation on the host, so both Windows impls must at least COMPILE.
# win32 6.x drops the symbols file_picker_windows.dart uses (COMObject,
# HRESULT-as-int, GUID.createInstance…), so it is pinned to the 5.x line that
# file_picker requires and share_plus's Windows code also compiles against.
# HOST-TEST-ONLY: win32 is Windows FFI — never compiled or linked into the
# iOS/Android app binary. Touches no crypto/network dependency. Exact-pinned
# like the other deps. (SESSION-9 CODE, flagged for merge — revisit if
# file_picker/share_plus realign on win32 6.x.)
dependency_overrides:
  win32: 5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Dev-only: host SQLite (FFI) so storage tests — raw-byte marker scans,
  # restart persistence — run under plain `flutter test` (no device). Same
  # tekartik mono-repo as sqflite; never shipped in the app binary.
  sqflite_common_ffi: ^2.3.7

flutter:
  generate: true
  uses-material-design: true

  # Vendored OFL typefaces (designs/brand/typography.md). google_fonts is
  # permanently rejected — runtime fetch = phone-home (app-architecture §8.5).
  # google/fonts ships variable-weight TTFs; weights 400/500/600 are selected
  # via FontVariation('wght', …) in lib/src/ui/theme/nimna_tokens.dart.
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-wght.ttf
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/spline_sans_mono/SplineSansMono-wght.ttf
